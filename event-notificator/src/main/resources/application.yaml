server:
  port: 8081

spring:
  application:
    name: event-notificator

  datasource:
    url: jdbc:postgresql://localhost:5432/event_notificator
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: event-notificator
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: "*"


jwt:
  secret: "374dea8e4dd662caeef44cc2f9b5dde020ffaaf5f69947519664af0d0809d530"
  expiration: 86400000
